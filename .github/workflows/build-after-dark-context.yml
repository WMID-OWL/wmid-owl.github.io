name: Build After Dark Context


on:

  workflow_run:

    workflows:

      - Generate Innanet Posts

    types:

      - completed


  workflow_dispatch:


permissions:

  contents:
    write


concurrency:

  group:
    after-dark-context

  cancel-in-progress:
    false


jobs:

  build-context:

    if: >

      github.event_name == 'workflow_dispatch'

      ||

      github.event.workflow_run.conclusion == 'success'


    runs-on:
      ubuntu-latest


    steps:


      - name: Check out repository

        uses:
          actions/checkout@v4

        with:

          ref:
            main


      - name: Set up Node

        uses:
          actions/setup-node@v4

        with:

          node-version:
            "20"


      - name: Check After Dark context-builder syntax

        run: |

          node --check scripts/build-after-dark-context.mjs


      - name: Build After Dark generation context

        run: |

          node scripts/build-after-dark-context.mjs


      - name: Commit updated After Dark queue

        run: |

          git add data/after-dark/generation-queue.json


          if git diff --cached --quiet; then

            echo "No After Dark context changes to commit."

            exit 0

          fi


          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          git commit \
            -m "Update After Dark generation context"


          git push
