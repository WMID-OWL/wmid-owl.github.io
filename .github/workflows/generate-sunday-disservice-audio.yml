name: Generate Sunday Disservice Audio

on:
  workflow_run:
    workflows:
      - Generate Sunday Disservice Sermon
    types:
      - completed

  workflow_dispatch:
    inputs:
      sermon_id:
        description: "Optional exact sermon ID to process when it does not already have audio"
        required: false
        default: ""

      dry_run:
        description: "Protected check only — do not contact ElevenLabs"
        required: false
        type: boolean
        default: true

      test_mode:
        description: "Use temporary non-canon Trey Wise test sermon"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sunday-disservice-audio
  cancel-in-progress: false

jobs:
  audio-disabled:
    if: ${{ vars.SUNDAY_DISSERVICE_AUDIO_ENABLED != 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest

    steps:
      - name: Confirm Sunday Disservice audio is disabled
        run: |
          echo "Sunday Disservice audio generation is currently disabled."
          echo "Written sermons will continue publishing normally."
          echo "ElevenLabs was not contacted."
          echo "Credits used by this workflow: 0."

  generate-audio:
    if: ${{ (vars.SUNDAY_DISSERVICE_AUDIO_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.dry_run == true || inputs.test_mode == true))) && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check Sunday Disservice audio-generator syntax
        run: |
          node --check scripts/generate-sunday-disservice-audio.mjs

      - name: Create temporary non-canon Trey Wise test sermon
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode == true }}
        run: |
          cat > data/sunday-disservice/sunday-disservice-test.json <<'EOF'
          {
            "id": "sunday-disservice-test",
            "sermon": 0,
            "deliveryDate": "2099-01-04",
            "label": "NON-CANON AUDIO TEST",
            "host": "Trey Wise",
            "headline": "Y'all Keep Confusing Loud With Right",
            "deck": "This ain't an OWL result and it ain't canon. I'm just here to make sure this mic works, this voice works, and y'all can actually hear me the way I'm supposed to sound.",
            "argument": {
              "title": "Having a hot take don't mean you made a good argument",
              "body": [
                "See, this is what I'm talkin' about. Folks hear somebody say something with enough confidence and suddenly we supposed to act like confidence is evidence. Nah. If your argument falls apart the second somebody asks one follow-up question, you ain't cookin'. You just made noise.",
                "And I know somebody already mad at how I said it. That's fine. Be mad. But don't get so caught up in the delivery that you miss the point. I'm not here to make every opinion comfortable. I'm here to tell you what I think, tell you why I think it, and stand on it until somebody gives me a reason not to.",
                "That's what Sunday Disservice is supposed to be. We can laugh, argue, call somebody out, give somebody their credit, and come back next week with receipts. Just don't expect me to nod along because everybody else decided something was true."
              ]
            },
            "praise": [
              {
                "title": "Credit where it's due",
                "body": "If somebody shows out, I'm gonna say they showed out. I can dislike the decision and still respect the performance. Both things can be true."
              }
            ],
            "condemnation": [
              {
                "title": "Stop moving the goalposts",
                "body": "What I can't stand is changing the argument every time the first one stops working. Pick a lane and defend it."
              }
            ],
            "favorites": [
              {
                "title": "Yeah, I got favorites",
                "body": "Everybody got people they believe in a little more than everybody else. At least I'm not pretending I don't."
              }
            ],
            "blindSpots": [
              {
                "title": "And y'all keep receipts",
                "body": "If I miss, call it out. Just make sure you remember when I was right too, because somehow those receipts always disappear."
              }
            ],
            "references": [],
            "closingWord": "Test or no test, the rule stays the same. Bring an argument, bring receipts, and don't expect me to agree just because everybody else does."
          }
          EOF

          node - <<'NODE'
          const fs = require("fs");

          const archivePath =
            "data/sunday-disservice/archive-index.json";

          const index =
            JSON.parse(
              fs.readFileSync(
                archivePath,
                "utf8"
              )
            );

          index.sermons =
            Array.isArray(index.sermons)
              ? index.sermons
              : [];

          index.sermons =
            index.sermons.filter(
              sermon =>
                sermon.id !==
                "sunday-disservice-test"
            );

          index.sermons.unshift({
            id: "sunday-disservice-test",
            sermon: 0,
            deliveryDate: "2099-01-04",
            label: "NON-CANON AUDIO TEST",
            headline: "Y'all Keep Confusing Loud With Right",
            file: "data/sunday-disservice/sunday-disservice-test.json"
          });

          fs.writeFileSync(
            archivePath,
            `${JSON.stringify(
              index,
              null,
              2
            )}\n`
          );
          NODE

      - name: Check for protected Sunday Disservice audio work
        id: audio_check
        env:
          TARGET_SERMON_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode == true && 'sunday-disservice-test' || (github.event_name == 'workflow_dispatch' && inputs.sermon_id || '') }}
        run: |
          RESULT=$(
            node scripts/generate-sunday-disservice-audio.mjs \
              --check-only
          )

          echo "$RESULT"

          SHOULD_GENERATE=$(
            echo "$RESULT" \
              | sed -n 's/^SHOULD_GENERATE=//p' \
              | tail -n 1
          )

          SERMON_ID=$(
            echo "$RESULT" \
              | sed -n 's/^SERMON_ID=//p' \
              | tail -n 1
          )

          CHARACTER_COUNT=$(
            echo "$RESULT" \
              | sed -n 's/^CHARACTER_COUNT=//p' \
              | tail -n 1
          )

          echo "should_generate=${SHOULD_GENERATE:-false}" >> "$GITHUB_OUTPUT"
          echo "sermon_id=${SERMON_ID}" >> "$GITHUB_OUTPUT"
          echo "character_count=${CHARACTER_COUNT:-0}" >> "$GITHUB_OUTPUT"

      - name: Report protected audio decision
        run: |
          echo "Generate audio: ${{ steps.audio_check.outputs.should_generate }}"
          echo "Sermon ID: ${{ steps.audio_check.outputs.sermon_id }}"
          echo "Narration characters: ${{ steps.audio_check.outputs.character_count }}"

      - name: Generate one new Sunday Disservice MP3
        if: >
          steps.audio_check.outputs.should_generate == 'true'
          &&
          (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TREY_WISE_VOICE_ID: ${{ secrets.TREY_WISE_VOICE_ID }}
          TARGET_SERMON_ID: ${{ steps.audio_check.outputs.sermon_id }}
          SUNDAY_DISSERVICE_AUDIO_MODEL: eleven_v3
          SUNDAY_DISSERVICE_AUDIO_FORMAT: mp3_44100_128
        run: |
          node scripts/generate-sunday-disservice-audio.mjs

      - name: Upload temporary Trey Wise test MP3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode == true && inputs.dry_run != true && steps.audio_check.outputs.should_generate == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: sunday-disservice-trey-wise-audio-test
          path: assets/audio/sunday-disservice/sunday-disservice-test.mp3
          if-no-files-found: error
          retention-days: 1

      - name: Confirm no ElevenLabs request was needed
        if: >
          steps.audio_check.outputs.should_generate != 'true'
        run: |
          echo "No new sermon requires audio."
          echo "ElevenLabs was not contacted."
          echo "Credits used by this workflow: 0."

      - name: Commit generated Sunday Disservice audio
        if: >
          steps.audio_check.outputs.should_generate == 'true'
          &&
          (github.event_name != 'workflow_dispatch' || inputs.test_mode != true)
        run: |
          git add \
            assets/audio/sunday-disservice \
            data/sunday-disservice

          if git diff --cached --quiet; then
            echo "No Sunday Disservice audio changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit \
            -m "Publish Sunday Disservice audio"

          git push
